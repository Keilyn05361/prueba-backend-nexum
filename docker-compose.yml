services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexum_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: nexum_db
    environment:
      MYSQL_DATABASE: nexum
      MYSQL_USER: nexum
      MYSQL_PASSWORD: nexum_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: